# The backend for the `integration` CI job (.github/workflows/ci.yml): Postgres, Redis and the
# Assay backend built from a checkout at a pinned commit (BACKEND_DIR). It listens on the e2e
# deployment entry's origins (API :3000, MCP :3200), so the proxy needs no reroute.
#
# Test values only: the per-run secrets (OAuth request cookie key, vault KEK, request-signing
# key) are generated by the job; the bearer tokens are the backend's own demo seed
# (scripts/mcp/seed/credentials.json). Privy is a placeholder that never authenticates.
# The chains are the backend's own defaults (.env.example: Solana devnet only), so no RPC,
# relayer or contract configuration is needed; the eip155 paid path is not part of this job.
name: assay-mcp-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assay_mcp_it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ${BACKEND_DIR:?BACKEND_DIR is the backend checkout}
      # The development stage keeps the migrations' tooling next to dist/.
      target: development
    env_file:
      - ${BACKEND_DIR}/.env.example
    environment:
      NODE_ENV: development
      SERVICE_TYPE: all
      API_PORT: "3000"
      MCP_PORT: "3200"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: assay_mcp_it
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_URL: redis://redis:6379
      MCP_PUBLIC_URL: http://localhost:3200
      WEB_APP_URL: http://localhost:4000
      AUTH_SESSION_SOURCE: both
      PRIVY_APP_ID: ci-placeholder-privy-app0
      PRIVY_APP_SECRET: ci-placeholder
      PRIVY_DEFAULT_CHAIN_ID: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
      PRIVY_USER_LOOKUP_ENABLED: "false"
      # The public testnet USDG token (deployments.json, production); `yarn demo:seed` seeds the
      # demo bindings in it.
      ROBINHOOD_TESTNET_USDG_ADDRESS: "0xDbbC156dD414f43f2c952C1Be0f16A0B9a826Cd3"
      MCP_CREDENTIALS_FILE: /app/scripts/mcp/seed/credentials.json
      TOOL_CATALOGUE_SEED_FILE: /app/scripts/mcp/seed/catalogue.json
      PROVIDER_REGISTRY_SEED_FILE: /app/scripts/mcp/seed/providers.json
      OAUTH_REQUEST_COOKIE_SECRET: ${OAUTH_REQUEST_COOKIE_SECRET:?generated per run}
      CREDENTIAL_VAULT_KEKS: ${CREDENTIAL_VAULT_KEKS:?generated per run}
      PROVIDER_REQUEST_SIGNING_KEYS: ${PROVIDER_REQUEST_SIGNING_KEYS:?generated per run}
      BULLBOARD_ENABLED: "false"
      # The dashboard API's per-user windows: the suite calls one agent's routes back to back, many
      # more times than a person would. The MCP limits the suite compares stay on.
      API_USER_RATE_LIMITS_ENABLED: "false"
      EXAMPLES_ENABLED: "false"
    # The image carries only what the build needs (the backend's .dockerignore is an allowlist):
    # the seed files and the seed scripts the job runs come from the checkout, read-only.
    volumes:
      - ${BACKEND_DIR}/scripts:/app/scripts:ro
    command: ["sh", "-c", "yarn -s migration:run:prod && exec node dist/main"]
    ports:
      - "3000:3000"
      - "3200:3200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
