name: Release (PyPI)

# Publishes the PyPI package goassay-mcp on a pushed python/v* tag. Today that package is the
# placeholder in placeholders/pypi-goassay-mcp; a future Python proxy replaces PKG_DIR.
# Same shape as release.yml:
#   build:   no id-token, no environment. Checks the tag, builds the sdist and wheel, uploads
#            them with their sha256.
#   publish: environment "pypi" (python/v* tags only) and id-token: write. Verifies the sha256
#            and publishes with PyPI trusted publishing. No PyPI token is stored anywhere.
# Needed outside this file: the "pypi" environment with a deployment policy limited to python/v*
# tags; a tag ruleset (python/v*, signed, maintainers only); the repository variable
# RELEASE_TAGGERS; PyPI trusted publishing for goassay-mcp bound to this workflow
# (release-python.yml) and environment "pypi".
on:
  push:
    tags: ["python/v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-python
  cancel-in-progress: false

env:
  PKG_DIR: placeholders/pypi-goassay-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.dist.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Tag is annotated, signed by a maintainer, and matches the package version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_TAGGERS: ${{ vars.RELEASE_TAGGERS }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAGGERS:-}" ]; then echo "Repository variable RELEASE_TAGGERS is not set."; exit 1; fi
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          ref="$(api "git/ref/tags/$TAG")"
          if [ "$(jq -r .object.type <<<"$ref")" != "tag" ]; then echo "Tag $TAG is not an annotated tag."; exit 1; fi
          tag="$(api "git/tags/$(jq -r .object.sha <<<"$ref")")"
          if [ "$(jq -r .verification.verified <<<"$tag")" != "true" ]; then echo "Tag is not signed by a verified key."; exit 1; fi
          tagger="$(jq -r '.tagger.email | ascii_downcase' <<<"$tag")"
          if ! tr ',' '\n' <<<"$RELEASE_TAGGERS" | tr -d ' ' | tr '[:upper:]' '[:lower:]' | grep -qxF "$tagger"; then echo "Tagger is not a release maintainer."; exit 1; fi
          if [ "$(jq -r .object.type <<<"$tag")" != "commit" ] || [ "$(jq -r .object.sha <<<"$tag")" != "$COMMIT" ]; then echo "Tag does not point at the commit being built."; exit 1; fi
          version="$(python -c "import tomllib;print(tomllib.load(open('$PKG_DIR/pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "python/v$version" ]; then echo "Tag $TAG does not match $PKG_DIR/pyproject.toml $version."; exit 1; fi

      - run: pip install build==1.6.1 twine==7.0.0
      - run: python -m build --outdir "$GITHUB_WORKSPACE/out" "$PKG_DIR"
      - run: twine check --strict out/*
      - name: Digest of the distributions
        id: dist
        run: |
          set -euo pipefail
          (cd out && sha256sum * > ../SHA256SUMS)
          # The digest travels as a job output, outside the artifact, so a swapped artifact
          # cannot carry a matching checksum file.
          echo "sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          mv SHA256SUMS out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: out
      - name: Verify the distribution checksums
        working-directory: out
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Missing build digest."; exit 1; }
          echo "$SHA256  SHA256SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
          rm SHA256SUMS
          ls | grep -qvE '^goassay_mcp-[0-9]+\.[0-9]+\.[0-9]+(-py3-none-any\.whl|\.tar\.gz)$' && { echo "Unexpected file in dist."; exit 1; } || true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: out
