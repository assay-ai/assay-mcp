name: Release

# Runs only on a pushed version tag. Two jobs, so that no dev dependency ever runs where an
# npm publish credential can be minted:
#   build:   no id-token, no environment. Checks the tag, runs the full gate, packs the tarball
#            and uploads it with its sha256.
#   publish: environment "release" (v* tags only) and id-token: write. No
#            checkout of dev dependencies, no npm ci: it verifies the sha256 and publishes the
#            tarball with npm trusted publishing and provenance. No npm token is used.
# There is no manual approval step (owner decision 2026-10-19): a signed, verified tag from a
# listed maintainer is the release decision.
# Needed outside this file: the "release" environment with a deployment policy limited to v*
# tags; a tag ruleset (v*, signed, maintainers only); the repository
# variable RELEASE_TAGGERS (comma list of maintainer tagger emails); npm trusted publishing for
# @goassay-ai/mcp bound to this workflow and environment "release"; the npm setting
# "Require 2FA and disallow tokens".
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"

      - name: Tag is annotated, signed by a maintainer, and matches the package version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_TAGGERS: ${{ vars.RELEASE_TAGGERS }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAGGERS:-}" ]; then echo "Repository variable RELEASE_TAGGERS is not set."; exit 1; fi
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          ref="$(api "git/ref/tags/$TAG")"
          type="$(node -e 'console.log(JSON.parse(process.argv[1]).object.type)' "$ref")"
          if [ "$type" != "tag" ]; then echo "Tag $TAG is not an annotated tag."; exit 1; fi
          sha="$(node -e 'console.log(JSON.parse(process.argv[1]).object.sha)' "$ref")"
          tag="$(api "git/tags/$sha")"
          node -e '
            const t = JSON.parse(process.argv[1]);
            const allowed = process.env.RELEASE_TAGGERS.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
            if (t.verification?.verified !== true) { console.log("Tag is not signed by a verified key."); process.exit(1); }
            if (!allowed.includes(String(t.tagger?.email).toLowerCase())) { console.log("Tagger is not a release maintainer."); process.exit(1); }
            if (t.object?.type !== "commit" || t.object?.sha !== process.env.COMMIT) { console.log("Tag does not point at the commit being built."); process.exit(1); }
          ' "$tag"
          version="$(node -p 'require("./node/package.json").version')"
          if [ "$TAG" != "v$version" ]; then echo "Tag $TAG does not match node/package.json $version."; exit 1; fi

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:unscoped
      - name: Package has no version range and no install script
        run: npm run check:pack
      - name: deployments.json has no placeholder and two RPC hosts
        run: npm run check:release
      - run: node node/dist/cli.js --version

      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p out
          tarball="$(npm pack -w node --ignore-scripts --pack-destination out --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].filename))')"
          (cd out && sha256sum "$tarball" > "$tarball.sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          # The digest also travels as a job output, outside the artifact, so a swapped artifact
          # cannot carry a matching checksum file.
          echo "sha256=$(cut -d' ' -f1 "out/$tarball.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"
      - name: npm supports trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].trim().split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.log("npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1); }
          ' "$(npm --version)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: out
      - name: Verify the tarball checksum
        working-directory: out
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" =~ ^goassay-ai-mcp-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]] || { echo "Unexpected tarball name."; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Missing build digest."; exit 1; }
          echo "$SHA256  $TARBALL" | sha256sum --check --strict
      - name: Publish with provenance (npm trusted publishing)
        working-directory: out
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --ignore-scripts
