name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: "integration and examples jobs: the assay-backend commit to test against (full SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle loads nothing but built-ins and @napi-rs/keyring
        run: npm run check:bundle
      - name: No unscoped install command
        run: npm run check:unscoped
      - name: Package contents, exact versions, no install scripts
        run: npm run check:pack
      - name: The SDK reuses the signer and guards, never a copy
        run: npm run check:no-fork
      - name: Smoke test
        run: node node/dist/cli.js --version

  node20:
    # The package supports Node >= 20. The dev tools need Node 22, so build on 22 and run the bundle on 20.
    name: smoke (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: node node/dist/cli.js --version

  keychain:
    # The real OS keychain (spec §7.9, §12.4): round-trip and the startup probe on every OS, and
    # "no keychain" / "locked keychain" → exit 1 with the exact text. The default test run never
    # touches the keychain; these runs opt in through the env vars below.
    name: keychain (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: windows
            os: windows-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: linux secret service
            os: ubuntu-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: linux no secret service
            os: ubuntu-latest
            env: ASSAY_MCP_EXPECT_KEYCHAIN=unavailable
            experimental: false
          - name: macos locked
            os: macos-latest
            env: ASSAY_MCP_EXPECT_KEYCHAIN=locked
            # The locked-store text is matched on the platform's error text (not yet seen on a runner).
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Temporary keychain (macOS)
        # Never the runner's login keychain: a throwaway keychain with a random password is
        # created, unlocked (locked again below for the "locked" run) and put first in the search
        # list and as the default. The "always()" step at the end deletes it.
        if: startsWith(matrix.name, 'macos')
        shell: bash
        run: |
          KC="$RUNNER_TEMP/assay-ci.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASS"
          security list-keychains -d user | tr -d '"' | sed 's/^ *//' > "$RUNNER_TEMP/keychains.before"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 900 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(cat "$RUNNER_TEMP/keychains.before")
          security default-keychain -d user -s "$KC"
          if [ "${{ matrix.name }}" = "macos locked" ]; then security lock-keychain "$KC"; fi
          echo "ASSAY_CI_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Keychain tests
        if: matrix.name == 'macos' || matrix.name == 'windows'
        shell: bash
        run: env ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
      - name: Keychain tests (Secret Service under dbus + gnome-keyring)
        if: matrix.name == 'linux secret service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          dbus-run-session -- sh -c 'printf "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && env ${{ matrix.env }} npx vitest run test/keychain.test.ts'
        working-directory: node
      - name: Keychain tests (no Secret Service)
        if: matrix.name == 'linux no secret service'
        run: env -u DBUS_SESSION_BUS_ADDRESS ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
      - name: Keychain tests (locked keychain)
        if: matrix.name == 'macos locked'
        run: env ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
      - name: Delete the temporary keychain (macOS)
        if: always() && startsWith(matrix.name, 'macos')
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/keychains.before" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.before") || true
          fi
          if [ -n "${ASSAY_CI_KEYCHAIN:-}" ]; then
            security delete-keychain "$ASSAY_CI_KEYCHAIN" || true
          fi

  examples:
    # Spec §10.3 and §12.3 row 10: both SDK examples against the e2e backend (Postgres, Redis and
    # the backend built from a pinned commit; the same pattern as the proxy's integration job),
    # with a development origin in code. Needs the backend read token and the LLM keys as secrets,
    # and is skipped cleanly (a notice, never a failure, never a secret printed) when any is absent,
    # as on fork pull requests. The paid call needs an anvil fork with staked providers, which this
    # backend does not have: the paid path is proven by the stubbed-loop test (sdk/node/test/examples.test.ts).
    # Model ids are repository variables, never defaults in the examples.
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKEND_SHA: ${{ inputs.backend_sha || 'e91dc15e74aa617f42ddd78931b6c249470b6172' }}
      BACKEND_DIR: ${{ github.workspace }}/backend
      COMPOSE_FILE: sdk/node/examples/ci/backend.compose.yml
      HUMAN_TOKEN: mcp_demo_token_evm_buyer
      HAS_SECRETS: ${{ secrets.ASSAY_BACKEND_READ_TOKEN != '' && secrets.ANTHROPIC_API_KEY != '' && secrets.OPENAI_API_KEY != '' && vars.ANTHROPIC_MODEL != '' && vars.OPENAI_MODEL != '' }}
    steps:
      - name: Secrets present
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::The backend read token, an LLM key or a model variable is not set; the examples job is skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SECRETS == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SECRETS == 'true'
        with:
          repository: assay-ai/assay-backend
          ref: ${{ env.BACKEND_SHA }}
          token: ${{ secrets.ASSAY_BACKEND_READ_TOKEN }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
        if: env.HAS_SECRETS == 'true'
      - name: Start Postgres, Redis and the backend
        if: env.HAS_SECRETS == 'true'
        shell: bash
        run: |
          OAUTH_REQUEST_COOKIE_SECRET="$(openssl rand -hex 32)"
          CREDENTIAL_VAULT_KEKS="[{\"keyId\":\"ci-1\",\"key\":\"$(openssl rand -hex 32)\"}]"
          PROVIDER_REQUEST_SIGNING_KEYS="[{\"keyId\":\"ci-1\",\"secretKey\":\"$(openssl rand -hex 32)\"}]"
          echo "::add-mask::$OAUTH_REQUEST_COOKIE_SECRET"
          echo "::add-mask::$CREDENTIAL_VAULT_KEKS"
          echo "::add-mask::$PROVIDER_REQUEST_SIGNING_KEYS"
          export OAUTH_REQUEST_COOKIE_SECRET CREDENTIAL_VAULT_KEKS PROVIDER_REQUEST_SIGNING_KEYS
          docker compose up -d --build --wait postgres redis
          docker compose up -d --build backend
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null http://localhost:3000/api/v1/chains && curl -sf -o /dev/null http://localhost:3200/.well-known/oauth-protected-resource; then
              echo "backend up"; break
            fi
            sleep 5
          done
          curl -sf -o /dev/null http://localhost:3200/.well-known/oauth-protected-resource || { docker compose logs backend | tail -100; exit 1; }
      - name: Seed the demo identities
        if: env.HAS_SECRETS == 'true'
        run: node sdk/node/examples/ci/seed-sql.mjs "$BACKEND_DIR/scripts/mcp/seed/credentials.json" "$HUMAN_TOKEN" | docker compose exec -T postgres psql -q -U postgres -d assay_mcp_it -v ON_ERROR_STOP=1
      - name: Mint an API key for the demo agent
        if: env.HAS_SECRETS == 'true'
        shell: bash
        run: |
          AGENT_ID="$(node -e 'const c=require(process.argv[1])[process.argv[2]];process.stdout.write(c.agentId)' "$BACKEND_DIR/scripts/mcp/seed/credentials.json" "$HUMAN_TOKEN")"
          KEY="$(curl -sf -X POST "http://localhost:3000/api/v1/agents/$AGENT_ID/credentials" -H "authorization: Bearer $HUMAN_TOKEN" -H 'content-type: application/json' -d '{"name":"sdk examples"}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).data.token))')"
          echo "::add-mask::$KEY"
          echo "ASSAY_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Anthropic example
        if: env.HAS_SECRETS == 'true'
        working-directory: sdk/node
        env:
          ASSAY_URL: http://localhost:3200/?free=1
          ASSAY_DEV_ORIGIN: http://localhost:3200
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node run-example.mjs anthropic-messages
      - name: OpenAI example
        if: env.HAS_SECRETS == 'true'
        working-directory: sdk/node
        env:
          ASSAY_URL: http://localhost:3200/?free=1
          ASSAY_DEV_ORIGIN: http://localhost:3200
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node run-example.mjs openai-responses
      - name: Backend logs
        if: failure() && env.HAS_SECRETS == 'true'
        run: docker compose logs backend | tail -300
      - name: Stop
        if: always() && env.HAS_SECRETS == 'true'
        run: docker compose down -v

  integration:
    # Spec §12.1 through the proxy (Task 2.17): node/test/integration/equivalence.test.ts and the
    # OAuth e2e test, against the Part 1+2 backend built from the commit below, with Postgres
    # and Redis (node/test/integration/backend.compose.yml). The backend repository is private:
    # the job needs a read-only token in the ASSAY_BACKEND_READ_TOKEN secret and is skipped
    # without one (fork pull requests). The paid path needs an anvil fork with staked providers
    # and skips here (see the test's header).
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The backend under test: assay-backend feat/mcp-oauth, pinned by full commit SHA.
      BACKEND_SHA: ${{ inputs.backend_sha || 'e91dc15e74aa617f42ddd78931b6c249470b6172' }}
      BACKEND_DIR: ${{ github.workspace }}/backend
      COMPOSE_FILE: node/test/integration/backend.compose.yml
      # A person's session from the backend's own demo seed (scripts/mcp/seed/credentials.json),
      # on the backend's default chain.
      HUMAN_TOKEN: mcp_demo_token_broke
      HAS_BACKEND_TOKEN: ${{ secrets.ASSAY_BACKEND_READ_TOKEN != '' }}
    steps:
      - name: Backend token present
        if: env.HAS_BACKEND_TOKEN != 'true'
        run: echo "::notice::ASSAY_BACKEND_READ_TOKEN is not set; the integration job is skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_BACKEND_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_BACKEND_TOKEN == 'true'
        with:
          repository: assay-ai/assay-backend
          ref: ${{ env.BACKEND_SHA }}
          token: ${{ secrets.ASSAY_BACKEND_READ_TOKEN }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_BACKEND_TOKEN == 'true'
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
        if: env.HAS_BACKEND_TOKEN == 'true'
      - name: Start Postgres, Redis and the backend
        if: env.HAS_BACKEND_TOKEN == 'true'
        shell: bash
        run: |
          # Per-run test secrets, never stored. The later compose steps (seed, SQL, logs, stop)
          # interpolate the same file, so the values go to GITHUB_ENV, masked.
          OAUTH_REQUEST_COOKIE_SECRET="$(openssl rand -hex 32)"
          KEK="$(openssl rand -hex 32)"
          SIGNING="$(openssl rand -hex 32)"
          echo "::add-mask::$OAUTH_REQUEST_COOKIE_SECRET"
          echo "::add-mask::$KEK"
          echo "::add-mask::$SIGNING"
          CREDENTIAL_VAULT_KEKS="[{\"keyId\":\"ci-1\",\"key\":\"$KEK\"}]"
          PROVIDER_REQUEST_SIGNING_KEYS="[{\"keyId\":\"ci-1\",\"secretKey\":\"$SIGNING\"}]"
          {
            echo "OAUTH_REQUEST_COOKIE_SECRET=$OAUTH_REQUEST_COOKIE_SECRET"
            echo "CREDENTIAL_VAULT_KEKS=$CREDENTIAL_VAULT_KEKS"
            echo "PROVIDER_REQUEST_SIGNING_KEYS=$PROVIDER_REQUEST_SIGNING_KEYS"
          } >> "$GITHUB_ENV"
          export OAUTH_REQUEST_COOKIE_SECRET CREDENTIAL_VAULT_KEKS PROVIDER_REQUEST_SIGNING_KEYS
          docker compose up -d --wait postgres redis
          docker compose up -d --build backend
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null http://localhost:3000/api/v1/chains && curl -sf -o /dev/null http://localhost:3200/.well-known/oauth-protected-resource; then
              echo "backend up"; break
            fi
            sleep 5
          done
          curl -sf -o /dev/null http://localhost:3200/.well-known/oauth-protected-resource || { docker compose logs backend | tail -100; exit 1; }
      - name: Seed the demo identities, verification policies and catalogue bindings
        if: env.HAS_BACKEND_TOKEN == 'true'
        run: |
          node node/test/integration/seed-sql.mjs "$BACKEND_DIR/scripts/mcp/seed/credentials.json" "$HUMAN_TOKEN" | docker compose exec -T postgres psql -q -U postgres -d assay_mcp_it -v ON_ERROR_STOP=1
          docker compose exec -T backend yarn -s mcp:policies
          docker compose exec -T backend yarn -s demo:seed
      - name: Equivalence through the proxy, and OAuth e2e
        if: env.HAS_BACKEND_TOKEN == 'true'
        working-directory: node
        env:
          ASSAY_MCP_E2E: "1"
          ASSAY_MCP_E2E_HUMAN_TOKEN: ${{ env.HUMAN_TOKEN }}
          ASSAY_MCP_E2E_VERBOSE: "1"
          # The Pause rows change the agent and organization rows directly, as an operator would.
          ASSAY_MCP_E2E_SQL: docker compose -f ${{ github.workspace }}/node/test/integration/backend.compose.yml exec -T postgres psql -q -U postgres -d assay_mcp_it -v ON_ERROR_STOP=1
        run: npx vitest run test/integration test/oauth-e2e.test.ts
      - name: Backend logs
        if: failure() && env.HAS_BACKEND_TOKEN == 'true'
        run: docker compose logs backend | tail -300
      - name: Stop
        if: always() && env.HAS_BACKEND_TOKEN == 'true'
        run: docker compose down -v
