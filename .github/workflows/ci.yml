name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: "integration job: the assay-backend commit to test against (full SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle loads nothing but built-ins and @napi-rs/keyring
        run: npm run check:bundle
      - name: No unscoped install command
        run: npm run check:unscoped
      - name: Package contents, exact versions, no install scripts
        run: npm run check:pack
      - name: The payment core comes from @goassay-ai/sdk/core, never a local copy
        run: npm run check:no-fork
      - name: Smoke test
        run: node node/dist/cli.js --version

  node20:
    # The package supports Node >= 20. The dev tools need Node 22, so build on 22 and run the bundle on 20.
    name: smoke (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: node node/dist/cli.js --version

  keychain:
    # The real OS keychain (spec §7.9, §12.4): round-trip and the startup probe on every OS, and
    # "no keychain" / "locked keychain" → exit 1 with the exact text. The default test run never
    # touches the keychain; these runs opt in through the env vars below.
    name: keychain (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: windows
            os: windows-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: linux secret service
            os: ubuntu-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: linux no secret service
            os: ubuntu-latest
            env: ASSAY_MCP_EXPECT_KEYCHAIN=unavailable
            experimental: false
          - name: macos locked
            os: macos-latest
            env: ASSAY_MCP_EXPECT_KEYCHAIN=locked
            # The locked-store text is matched on the platform's error text (not yet seen on a runner).
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Temporary keychain (macOS)
        # Never the runner's login keychain: a throwaway keychain with a random password is
        # created, unlocked (locked again below for the "locked" run) and put first in the search
        # list and as the default. The "always()" step at the end deletes it.
        if: startsWith(matrix.name, 'macos')
        shell: bash
        run: |
          KC="$RUNNER_TEMP/assay-ci.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASS"
          security list-keychains -d user | tr -d '"' | sed 's/^ *//' > "$RUNNER_TEMP/keychains.before"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 900 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(cat "$RUNNER_TEMP/keychains.before")
          security default-keychain -d user -s "$KC"
          if [ "${{ matrix.name }}" = "macos locked" ]; then
            # The probe only looks up an entry that does not exist: with the runner's own (unlocked)
            # login keychain still in the search list, that lookup answers "not found" from there
            # and never reaches the locked one. Search the locked keychain alone.
            security list-keychains -d user -s "$KC"
            security lock-keychain "$KC"
          fi
          echo "ASSAY_CI_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Keychain tests
        if: matrix.name == 'macos' || matrix.name == 'windows'
        shell: bash
        run: env ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
      - name: Keychain tests (Secret Service under dbus + gnome-keyring)
        if: matrix.name == 'linux secret service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          # A non-empty throwaway password: with an empty one the daemon cannot create the "login"
          # collection without a GUI prompt, and every Secret Service call finds no collection.
          dbus-run-session -- sh -c 'printf ci-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null && env ${{ matrix.env }} npx vitest run test/keychain.test.ts'
        working-directory: node
      - name: Keychain tests (no Secret Service)
        if: matrix.name == 'linux no secret service'
        run: env -u DBUS_SESSION_BUS_ADDRESS ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
      - name: Keychain tests (locked keychain)
        if: matrix.name == 'macos locked'
        run: env ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
      - name: Delete the temporary keychain (macOS)
        if: always() && startsWith(matrix.name, 'macos')
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/keychains.before" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.before") || true
          fi
          if [ -n "${ASSAY_CI_KEYCHAIN:-}" ]; then
            security delete-keychain "$ASSAY_CI_KEYCHAIN" || true
          fi

  integration:
    # Spec §12.1 through the proxy (Task 2.17): node/test/integration/equivalence.test.ts and the
    # OAuth e2e test, against the Part 1+2 backend built from the commit below, with Postgres
    # and Redis (node/test/integration/backend.compose.yml). The backend repository is public, so
    # the job needs no secret and always runs. The paid path needs an anvil fork with staked providers
    # and skips here (see the test's header).
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The backend under test: assay-backend main, pinned by full commit SHA.
      BACKEND_SHA: ${{ inputs.backend_sha || '9f0f4db18afddc5f496782d04b764be2b5dd884f' }}
      BACKEND_DIR: ${{ github.workspace }}/backend
      COMPOSE_FILE: node/test/integration/backend.compose.yml
      # A person's session from the backend's own demo seed (scripts/mcp/seed/credentials.json),
      # on the backend's default chain.
      HUMAN_TOKEN: mcp_demo_token_broke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: assay-ai/assay-backend
          ref: ${{ env.BACKEND_SHA }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Start Postgres, Redis and the backend
        shell: bash
        run: |
          # Per-run test secrets, never stored. The later compose steps (seed, SQL, logs, stop)
          # interpolate the same file, so the values go to GITHUB_ENV, masked.
          OAUTH_REQUEST_COOKIE_SECRET="$(openssl rand -hex 32)"
          KEK="$(openssl rand -hex 32)"
          SIGNING="$(openssl rand -hex 32)"
          echo "::add-mask::$OAUTH_REQUEST_COOKIE_SECRET"
          echo "::add-mask::$KEK"
          echo "::add-mask::$SIGNING"
          CREDENTIAL_VAULT_KEKS="[{\"keyId\":\"ci-1\",\"key\":\"$KEK\"}]"
          PROVIDER_REQUEST_SIGNING_KEYS="[{\"keyId\":\"ci-1\",\"secretKey\":\"$SIGNING\"}]"
          {
            echo "OAUTH_REQUEST_COOKIE_SECRET=$OAUTH_REQUEST_COOKIE_SECRET"
            echo "CREDENTIAL_VAULT_KEKS=$CREDENTIAL_VAULT_KEKS"
            echo "PROVIDER_REQUEST_SIGNING_KEYS=$PROVIDER_REQUEST_SIGNING_KEYS"
          } >> "$GITHUB_ENV"
          export OAUTH_REQUEST_COOKIE_SECRET CREDENTIAL_VAULT_KEKS PROVIDER_REQUEST_SIGNING_KEYS
          docker compose up -d --wait postgres redis
          docker compose up -d --build backend
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null http://localhost:3000/api/v1/chains && curl -sf -o /dev/null http://localhost:3200/.well-known/oauth-protected-resource; then
              echo "backend up"; break
            fi
            sleep 5
          done
          curl -sf -o /dev/null http://localhost:3200/.well-known/oauth-protected-resource || { docker compose logs backend | tail -100; exit 1; }
      - name: Seed the demo identities, verification policies and catalogue bindings
        run: |
          node node/test/integration/seed-sql.mjs "$BACKEND_DIR/scripts/mcp/seed/credentials.json" "$HUMAN_TOKEN" | docker compose exec -T postgres psql -q -U postgres -d assay_mcp_it -v ON_ERROR_STOP=1
          docker compose exec -T backend yarn -s mcp:policies
          docker compose exec -T backend yarn -s demo:seed
      - name: Equivalence through the proxy, and OAuth e2e
        working-directory: node
        env:
          ASSAY_MCP_E2E: "1"
          ASSAY_MCP_E2E_HUMAN_TOKEN: ${{ env.HUMAN_TOKEN }}
          ASSAY_MCP_E2E_VERBOSE: "1"
          # The Pause rows change the agent and organization rows directly, as an operator would.
          ASSAY_MCP_E2E_SQL: docker compose -f ${{ github.workspace }}/node/test/integration/backend.compose.yml exec -T postgres psql -q -U postgres -d assay_mcp_it -v ON_ERROR_STOP=1
        run: npx vitest run test/integration test/oauth-e2e.test.ts
      - name: Backend logs
        if: failure()
        run: docker compose logs backend | tail -300
      - name: Stop
        if: always()
        run: docker compose down -v
