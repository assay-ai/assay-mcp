name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle loads nothing but built-ins and @napi-rs/keyring
        run: npm run check:bundle
      - name: No unscoped install command
        run: npm run check:unscoped
      - name: Package contents, exact versions, no install scripts
        run: npm run check:pack
      - name: Smoke test
        run: node node/dist/cli.js --version

  node20:
    # The package supports Node >= 20. The dev tools need Node 22, so build on 22 and run the bundle on 20.
    name: smoke (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: node node/dist/cli.js --version

  keychain:
    # The real OS keychain (spec §7.9, §12.4): round-trip and the startup probe on every OS, and
    # "no keychain" / "locked keychain" → exit 1 with the exact text. The default test run never
    # touches the keychain; these runs opt in through the env vars below.
    name: keychain (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: windows
            os: windows-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: linux secret service
            os: ubuntu-latest
            env: ASSAY_MCP_REAL_KEYCHAIN=1
            experimental: false
          - name: linux no secret service
            os: ubuntu-latest
            env: ASSAY_MCP_EXPECT_KEYCHAIN=unavailable
            experimental: false
          - name: macos locked
            os: macos-latest
            env: ASSAY_MCP_EXPECT_KEYCHAIN=locked
            # The locked-store text is matched on the platform's error text (not yet seen on a runner).
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Keychain tests
        if: matrix.name == 'macos' || matrix.name == 'windows'
        shell: bash
        run: env ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
      - name: Keychain tests (Secret Service under dbus + gnome-keyring)
        if: matrix.name == 'linux secret service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          dbus-run-session -- sh -c 'printf "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && env ${{ matrix.env }} npx vitest run test/keychain.test.ts'
        working-directory: node
      - name: Keychain tests (no Secret Service)
        if: matrix.name == 'linux no secret service'
        run: env -u DBUS_SESSION_BUS_ADDRESS ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
      - name: Keychain tests (locked keychain)
        if: matrix.name == 'macos locked'
        run: |
          security create-keychain -p ci-only locked-test.keychain
          security list-keychains -d user -s locked-test.keychain
          security default-keychain -d user -s locked-test.keychain
          security lock-keychain locked-test.keychain
          env ${{ matrix.env }} npx vitest run test/keychain.test.ts
        working-directory: node
